<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#e8d5b0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- TK Mark -->
  <rect x="4" y="12" width="56" height="56" rx="12" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <text x="32" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="url(#gold)" filter="url(#glow)">TK</text>

  <!-- Digital text -->
  <text x="74" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="300" letter-spacing="8" fill="#f5f5f5">DIGITAL</text>

  <!-- Accent line -->
  <line x1="74" y1="52" x2="190" y2="52" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
</svg>
